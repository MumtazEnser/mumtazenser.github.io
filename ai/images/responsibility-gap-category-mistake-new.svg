<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">The Responsibility Gap Is a Category Mistake</title>
<desc id="desc">Dark academic poster showing responsibility persisting through acceptance, authorization, validation, and multiple agents.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#070707"/><stop offset="1" stop-color="#171717"/></linearGradient>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.cream{fill:#f5f1e8}.gold{fill:#d5a55b}.stroke{stroke:#d5a55b;fill:none;stroke-width:2}.muted{fill:#d6d0c6}.label{font-size:25px;letter-spacing:1px}.body{font-size:25px}.title{font-size:58px;font-weight:700}.sub{font-size:32px;font-style:italic}.small{font-size:22px}.dash{stroke-dasharray:12 14}
  </style>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<rect x="31" y="37" width="1474" height="949" rx="15" class="stroke"/>
<line x1="780" y1="37" x2="780" y2="986" stroke="#2f2f2f"/>

<text x="82" y="116" class="serif gold" font-size="36">03</text>
<text x="82" y="196" class="serif cream title">The Responsibility</text>
<text x="82" y="263" class="serif cream title">Gap Is a Category</text>
<text x="82" y="330" class="serif cream title">Mistake</text>
<line x1="82" y1="379" x2="158" y2="379" class="stroke"/>
<text x="82" y="438" class="serif gold sub">AI, Ethics, and the Fiction of</text>
<text x="82" y="482" class="serif gold sub">Missing Responsibility</text>

<text x="82" y="548" class="serif muted body">This paper argues that what is commonly described</text>
<text x="82" y="589" class="serif muted body">as a “responsibility gap” is not a gap in the</text>
<text x="82" y="630" class="serif muted body">presence of responsibility but a category mistake</text>
<text x="82" y="671" class="serif muted body">in its attribution. Responsibility persists through</text>
<text x="82" y="712" class="serif muted body">acceptance, validation, and authorization.</text>

<rect x="82" y="862" width="244" height="70" class="stroke"/>
<text x="111" y="907" class="serif gold" font-size="28">Read Paper →</text>
<text x="365" y="907" class="serif gold" font-size="27" text-decoration="underline">Zenodo DOI ↗</text>

<!-- conceptual cycle -->
<circle cx="1118" cy="461" r="123" class="stroke"/>
<text x="1118" y="448" text-anchor="middle" class="sans gold" font-size="27">RESPONSIBILITY</text>
<text x="1118" y="486" text-anchor="middle" class="sans gold" font-size="27">PERSISTS</text>

<circle cx="1118" cy="208" r="52" class="stroke"/>
<circle cx="1118" cy="191" r="14" class="stroke"/>
<path d="M1092 232c4-23 48-23 52 0" class="stroke"/>
<text x="1118" y="290" text-anchor="middle" class="sans gold label">ACCEPTANCE</text>

<circle cx="1363" cy="460" r="52" class="stroke"/>
<path d="M1339 438l24-11 24 11v25c0 19-12 34-24 42-12-8-24-23-24-42z" class="stroke"/>
<text x="1363" y="542" text-anchor="middle" class="sans gold label">AUTHORIZATION</text>

<circle cx="1118" cy="712" r="52" class="stroke"/>
<path d="M1098 686h32l13 13v42h-45z M1130 686v14h13" class="stroke"/>
<line x1="1108" y1="716" x2="1132" y2="716" class="stroke"/>
<line x1="1108" y1="728" x2="1128" y2="728" class="stroke"/>
<text x="1118" y="792" text-anchor="middle" class="sans gold label">VALIDATION</text>

<circle cx="875" cy="460" r="52" class="stroke"/>
<circle cx="855" cy="450" r="10" class="stroke"/><circle cx="875" cy="442" r="12" class="stroke"/><circle cx="895" cy="450" r="10" class="stroke"/>
<path d="M837 480c2-17 30-17 33 0M862 478c3-21 36-21 39 0M883 480c2-17 30-17 33 0" class="stroke"/>
<text x="875" y="540" text-anchor="middle" class="sans gold label">MULTIPLE</text>
<text x="875" y="572" text-anchor="middle" class="sans gold label">AGENTS</text>

