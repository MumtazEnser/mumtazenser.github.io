
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wittgenstein — Philosophical Architecture</title>
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
color:#ece3d1;
font-family:Georgia, serif;
overflow-x:hidden;
}

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:28px 48px;
z-index:100;
background:rgba(0,0,0,.55);
backdrop-filter:blur(8px);
border-bottom:1px solid rgba(212,171,108,.15);
}

.logo{
font-size:20px;
letter-spacing:2px;
color:#e7d7bf;
}

nav a{
margin-left:36px;
text-decoration:none;
color:#d8c9b1;
font-size:14px;
letter-spacing:1px;
}

.active{
border-bottom:1px solid #d4ab6c;
padding-bottom:8px;
}

.hero{
width:100%;
min-height:100vh;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.hero img{
width:100%;
height:100vh;
object-fit:cover;
display:block;
}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.35));
pointer-events:none;
}

.content{
position:absolute;
bottom:40px;
left:40px;
right:40px;
display:flex;
justify-content:space-between;
align-items:flex-end;
}

.signature{
text-align:right;
}

.signature .name{
font-size:52px;
font-style:italic;
color:#d4ab6c;
}

.signature .sub{
margin-top:10px;
letter-spacing:4px;
font-size:12px;
}

@media(max-width:1100px){

.content{
flex-direction:column;
gap:20px;
align-items:flex-start;
}

.signature{
text-align:left;
}

.signature .name{
font-size:36px;
}

.hero img{
height:auto;
min-height:100vh;
}

}

</style>
</head>
<body>

<header class="navbar">
<div class="logo">MUMTAZ ENSER</div>

<nav>
<a href="/">HOME</a>
<a href="/ai/">AI</a>
<a class="active" href="#">WITTGENSTEIN</a>
<a href="#">ABOUT</a>
</nav>
</header>

<section class="hero">

<img src="assets/hero-mockup.png" alt="Wittgenstein Philosophical Architecture">

<div class="overlay"></div>

<div class="content">

<div></div>

<div class="signature">
<div class="name">Mumtaz Enser</div>
<div class="sub">PHILOSOPHICAL ARCHITECTURE</div>
</div>

</div>

</section>

</body>
</html>
